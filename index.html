<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 14px/1.4 system-ui, sans-serif; }
    .stage { position: fixed; inset: 0; }
    .stage.mirror { transform: scaleX(-1); }
    .stage video, .stage canvas {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block;
    }
    .stage video { filter: saturate(0.3); }          /* muted, so the blue line stands out */
    .bar {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
      padding: 8px 12px; border-radius: 12px; background: rgba(0, 0, 0, 0.55);
      max-width: calc(100% - 32px); box-sizing: border-box;
    }
    select, button {
      font: inherit; color: #fff; background: #222; border: 1px solid #444;
      border-radius: 8px; padding: 6px 10px; cursor: pointer;
    }
    button:hover, select:hover { background: #333; }
    .msg {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 16px; pointer-events: none;
    }
    .msg[hidden] { display: none; }
    .status { position: fixed; top: 12px; left: 12px; font-size: 12px; opacity: 0.75; }
  </style>
</head>
<body>
  <div id="stage" class="stage mirror">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="ink"></canvas>
  </div>
  <div id="msg" class="msg">Starting camera…</div>
  <div id="status" class="status"></div>
  <div class="bar">
    <select id="cameras" aria-label="Camera" hidden></select>
    <button id="undo" type="button">Undo</button>
    <button id="clear" type="button">Clear</button>
    <button id="mirror" type="button">Mirror: on</button>
    <button id="snap" type="button">Snapshot</button>
  </div>

  <script type="module">
    import { HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

    const INK = '#0038ff';                             // primary blue
    const HINT = 'Point with one finger to draw · raise two fingers to lift the pen';

    const video = document.getElementById('video');
    const ink = document.getElementById('ink');
    const g = ink.getContext('2d');
    const stage = document.getElementById('stage');
    const msg = document.getElementById('msg');
    const status = document.getElementById('status');
    const picker = document.getElementById('cameras');
    let stream = null, hands = null, lastTs = 0;

    // Strokes are lists of points in video pixels, so they stay put when the window resizes.
    let strokes = [], current = null;
    let tip = null;                                    // smoothed fingertip
    let penDown = false, downVotes = 0;                // pen state, debounced over a few frames

    function show(text) { msg.textContent = text; msg.hidden = !text; }

    // ---------- camera ----------
    async function start(deviceId) {
      if (stream) stream.getTracks().forEach(t => t.stop());
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: deviceId ? { deviceId: { exact: deviceId } } : { width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();
        show('');
        await listCameras(stream.getVideoTracks()[0].getSettings().deviceId);
      } catch (err) {
        show(err.name === 'NotAllowedError'
          ? 'Camera access was blocked. Allow it in your browser’s site settings and reload.'
          : `Couldn’t start the camera: ${err.message}`);
      }
    }

    // Device names are only available once permission has been granted.
    async function listCameras(currentId) {
      const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      picker.innerHTML = '';
      devices.forEach((d, i) => picker.add(new Option(d.label || `Camera ${i + 1}`, d.deviceId, false, d.deviceId === currentId)));
      picker.hidden = devices.length < 2;
    }

    // ---------- hand tracking ----------
    async function loadHands() {
      status.textContent = 'Loading hand tracking…';
      try {
        const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
        hands = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
            delegate: 'GPU',
          },
          runningMode: 'VIDEO',
          numHands: 1,
        });
        status.textContent = HINT;
      } catch (err) {
        status.textContent = 'Hand tracking unavailable — check your connection and reload';
      }
    }

    // A finger counts as raised when its tip is clearly farther from the wrist than its middle joint.
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const raised = (lm, tipI, pipI) => dist(lm[0], lm[tipI]) > dist(lm[0], lm[pipI]) * 1.15;

    function track(now) {
      if (!hands) return;
      lastTs = Math.max(now, lastTs + 1);
      const lm = hands.detectForVideo(video, lastTs).landmarks[0];
      let wantDown = false;
      if (lm) {
        const W = video.videoWidth, H = video.videoHeight;
        const raw = { x: lm[8].x * W, y: lm[8].y * H };        // index fingertip
        // smooth more when the finger is still (less jitter), less when it moves fast (less lag)
        if (!tip) tip = { ...raw };
        const speed = Math.hypot(raw.x - tip.x, raw.y - tip.y);
        const k = Math.min(1, 0.25 + speed / (W * 0.03));
        tip.x += (raw.x - tip.x) * k; tip.y += (raw.y - tip.y) * k;
        wantDown = raised(lm, 8, 6) && !raised(lm, 12, 10);   // pointing: index up, middle down
      } else {
        tip = null;
      }
      downVotes = Math.max(-2, Math.min(2, downVotes + (wantDown ? 1 : -1)));
      const next = downVotes >= 2 ? true : downVotes <= -2 ? false : penDown;
      if (next && !penDown) { current = [{ ...tip }]; strokes.push(current); }
      if (!next) current = null;
      penDown = next;
      if (penDown && current && tip) {
        const last = current[current.length - 1];
        if (Math.hypot(tip.x - last.x, tip.y - last.y) > 1.5) current.push({ ...tip });
      }
    }

    // ---------- drawing ----------
    function lineWidth() { return Math.max(2, video.videoWidth * 0.0035); }
    function drawStrokes(ctx) {
      ctx.strokeStyle = INK; ctx.lineWidth = lineWidth();
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const s of strokes) {
        if (s.length === 1) {                                 // a tap leaves a dot
          ctx.fillStyle = INK;
          ctx.beginPath(); ctx.arc(s[0].x, s[0].y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill();
          continue;
        }
        ctx.beginPath(); ctx.moveTo(s[0].x, s[0].y);
        for (let i = 1; i < s.length - 1; i++) {              // curve through midpoints for a smooth line
          const mx = (s[i].x + s[i + 1].x) / 2, my = (s[i].y + s[i + 1].y) / 2;
          ctx.quadraticCurveTo(s[i].x, s[i].y, mx, my);
        }
        const e = s[s.length - 1];
        ctx.lineTo(e.x, e.y);
        ctx.stroke();
      }
    }
    function drawCursor() {
      if (!tip) return;
      const r = lineWidth() * 2.2;
      g.lineWidth = Math.max(1.5, lineWidth() * 0.45);
      g.strokeStyle = INK; g.fillStyle = INK;
      g.beginPath(); g.arc(tip.x, tip.y, r, 0, Math.PI * 2);
      if (penDown) g.fill(); else g.stroke();
    }

    function frame(now) {
      requestAnimationFrame(frame);
      if (!(video.readyState >= 2 && video.videoWidth)) return;
      if (ink.width !== video.videoWidth || ink.height !== video.videoHeight) {
        ink.width = video.videoWidth; ink.height = video.videoHeight;
      }
      try { track(now); } catch (err) { console.warn('hand tracking failed', err); }
      g.clearRect(0, 0, ink.width, ink.height);
      drawStrokes(g);
      drawCursor();
    }

    // ---------- controls ----------
    picker.addEventListener('change', () => start(picker.value));
    document.getElementById('undo').addEventListener('click', () => { strokes.pop(); current = null; });
    document.getElementById('clear').addEventListener('click', () => { strokes = []; current = null; });
    document.getElementById('mirror').addEventListener('click', e => {
      const on = stage.classList.toggle('mirror');
      e.target.textContent = `Mirror: ${on ? 'on' : 'off'}`;
    });
    // Snapshot: the muted frame with the drawing on top, flipped like the screen.
    document.getElementById('snap').addEventListener('click', () => {
      const W = video.videoWidth, H = video.videoHeight;
      if (!W) return;
      const shot = document.createElement('canvas');
      shot.width = W; shot.height = H;
      const s = shot.getContext('2d');
      s.drawImage(video, 0, 0);
      const img = s.getImageData(0, 0, W, H), d = img.data;
      for (let i = 0; i < d.length; i += 4) {                 // same 30% saturation as the screen
        const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        d[i] = l + (d[i] - l) * 0.3; d[i + 1] = l + (d[i + 1] - l) * 0.3; d[i + 2] = l + (d[i + 2] - l) * 0.3;
      }
      s.putImageData(img, 0, 0);
      drawStrokes(s);
      let outCanvas = shot;
      if (stage.classList.contains('mirror')) {
        outCanvas = document.createElement('canvas');
        outCanvas.width = W; outCanvas.height = H;
        const m = outCanvas.getContext('2d');
        m.translate(W, 0); m.scale(-1, 1); m.drawImage(shot, 0, 0);
      }
      const a = document.createElement('a');
      a.href = outCanvas.toDataURL('image/png');
      a.download = `drawing-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
      a.click();
    });

    if (!navigator.mediaDevices?.getUserMedia) {
      show('This browser can’t access the camera here. Open the page from http://localhost.');
    } else {
      loadHands();
      start();
      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
